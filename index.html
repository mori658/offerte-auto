<style>
:root{
  --sans: "Sofia Pro", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --bg:#001733;
  --card:#ffffff; --card-line:#cfe0ee; --card-line2:#eef3f8;
  --ink:#1f2d3d; --ink-soft:#5a6b7b;
  --accent:#2f9fd0; --accent-2:#42b7df; --badge-blue:#3f6fd1;
  --cta:#ec5b45; --cta-hover:#d94b36;
  --r-sm:12px; --r-md:16px; --r-lg:20px;
  --shadow:0 12px 30px rgba(0,0,0,.28);
  --shadow-hover:0 18px 40px rgba(0,0,0,.36);
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; padding:20px clamp(12px,3vw,40px);
}
button{ font-family:inherit; cursor:pointer; }
a{ color:inherit; text-decoration:none; }

.grid{ display:grid; gap:22px; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr)); max-width:1200px; margin:0 auto; }

/* ---- filtri ---- */
.filters{ position:relative; z-index:50; max-width:1200px; margin:0 auto 18px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.ms{ position:relative; }
.ms__btn{ display:flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--card-line); color:var(--ink); font-size:13.5px; font-weight:600; padding:9px 12px; border-radius:12px; cursor:pointer; }
.ms__btn.is-active{ border-color:var(--accent-2); box-shadow:0 0 0 2px rgba(66,183,223,.2); }
.ms__count{ color:var(--accent); }
.ms__chev{ color:var(--ink-soft); font-size:11px; }
.ms__panel{ display:none; position:absolute; top:calc(100% + 6px); left:0; min-width:210px; max-height:290px; overflow:auto; background:#fff; border:1px solid var(--card-line); border-radius:12px; box-shadow:var(--shadow); padding:6px; z-index:60; }
.ms.is-open .ms__panel{ display:block; }
.ms__opt{ display:flex; align-items:center; gap:8px; padding:7px 8px; font-size:13.5px; color:var(--ink); border-radius:8px; cursor:pointer; white-space:nowrap; }
.ms__opt:hover{ background:#f2f6fa; }
.ms__opt input{ width:15px; height:15px; accent-color:var(--accent-2); flex:0 0 auto; }
.price-filter{ display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--card-line); border-radius:12px; padding:6px 10px; }
.pf__lab{ font-size:13.5px; font-weight:600; color:var(--ink); }
.pf__box{ display:flex; align-items:center; gap:3px; background:#fbfdff; border:1px solid var(--card-line); border-radius:8px; padding:4px 7px; }
.pf__box>span{ color:var(--ink-soft); font-size:13px; }
.pf__box input{ width:62px; border:0; background:transparent; outline:none; font-size:13.5px; color:var(--ink); }
.pf__dash{ color:var(--ink-soft); }
.filters__reset{ background:transparent; border:0; color:#bcd2ea; font-size:13px; text-decoration:underline; padding:6px; cursor:pointer; }
.filters__reset:hover{ color:#fff; }
.filters__count{ color:#c7d6ea; font-size:13px; margin-left:auto; white-space:nowrap; }
.is-hidden{ display:none !important; }
.grid__empty{ display:none; grid-column:1/-1; text-align:center; color:#c7d6ea; padding:44px 20px; font-size:15px; }
@media (max-width:560px){
  .filters__count{ margin-left:0; width:100%; }
}

.flip{ perspective:1600px; }
.flip__inner{ display:grid; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.7,.2,1); min-height:440px; }
.flip.is-flipped .flip__inner{ transform:rotateY(180deg); }
.flip__face{
  grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--card); border:1.5px solid var(--card-line); border-radius:var(--r-lg);
  box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;
  transition:box-shadow .2s ease, transform .2s ease;
}
.flip__face--back{ transform:rotateY(180deg); }
.flip:not(.is-flipped) .flip__face--front:hover{ box-shadow:var(--shadow-hover); transform:translateY(-2px); }

/* ---- slider (card + lightbox condividono queste classi) ---- */
.slider{ position:relative; width:100%; height:100%; overflow:hidden; }
.slider__track{ display:flex; height:100%; will-change:transform; touch-action:pan-y; }
.slider__slide{ flex:0 0 100%; height:100%; }
.slider__slide img{ width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; user-select:none; pointer-events:none; }

.gallery{ position:relative; aspect-ratio:16/10; background:radial-gradient(120% 90% at 50% 20%,#f4f8fb 0%,#e7eef4 60%,#dbe6ee 100%); overflow:hidden; }
.gallery .slider__slide{ cursor:zoom-in; }

.gal-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:36px; height:36px; border:0; border-radius:50%;
  background:var(--bg); color:#fff; font-size:20px; font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.35); z-index:4; opacity:.92; transition:opacity .15s, background .15s;
}
.gal-nav:hover{ opacity:1; background:#012a5c; }
.gal-nav--prev{ left:8px; } .gal-nav--next{ right:8px; }
.gal-nav[disabled]{ opacity:0; pointer-events:none; }
.gal-dots{ position:absolute; bottom:8px; left:0; right:0; display:flex; gap:5px; justify-content:center; z-index:4; pointer-events:none; }
.gal-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.6); box-shadow:0 0 2px rgba(0,0,0,.5); transition:background .18s,width .18s; }
.gal-dot.is-active{ background:#fff; width:16px; border-radius:3px; }
.gal-count{ position:absolute; top:10px; right:10px; z-index:4; background:rgba(0,23,51,.75); color:#fff; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; pointer-events:none; }
.gal-fs{ position:absolute; right:8px; bottom:7px; z-index:5; width:30px; height:30px; border:0; border-radius:8px; background:var(--bg); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(0,0,0,.35); opacity:.92; transition:opacity .15s, background .15s; }
.gal-fs:hover{ opacity:1; background:#012a5c; }

.card__badges{ position:absolute; top:12px; left:12px; display:flex; gap:6px; flex-wrap:wrap; max-width:calc(100% - 24px); z-index:4; }
.badge{ font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:#fff; padding:5px 9px; border-radius:6px; line-height:1; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.18); }
.badge--offer{ background:var(--badge-blue); }
.badge--stock{ background:var(--accent-2); }
.warranty{ position:absolute; right:14px; bottom:26px; width:70px; height:70px; border-radius:50%; background:var(--accent-2); color:#fff; display:flex; align-items:center; justify-content:center; text-align:center; font-size:9.5px; font-weight:800; line-height:1.15; padding:8px; box-shadow:0 6px 16px rgba(0,0,0,.25); z-index:4; pointer-events:none; }

/* ---- body ---- */
.card__body{ padding:16px; display:flex; flex-direction:column; gap:10px; flex:1; }
.card__title{ font-size:16px; font-weight:400; color:var(--ink); letter-spacing:.3px; margin:0; line-height:1.15; text-transform:uppercase; }
.card__title strong{ font-weight:800; }
.card__version{ font-size:13px; color:var(--ink-soft); margin:-4px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card__meta{ font-size:12.5px; color:var(--ink-soft); border-top:1px solid var(--card-line2); border-bottom:1px solid var(--card-line2); padding:9px 0; }
.card__meta span+span::before{ content:"|"; margin:0 7px; color:#c3ccd4; }

.price{ margin-top:auto; }
.price__market{ display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; margin-bottom:2px; }
.price__label{ font-size:11px; color:var(--ink-soft); }
.price__old{ font-size:13px; color:#9aa7b2; text-decoration:line-through; }
.price__now{ font-size:26px; font-weight:800; color:var(--accent); line-height:1; display:block; margin-top:0; }
.card__where{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); }
.card__where .pin{ color:var(--accent-2); flex:0 0 auto; }
.card__where strong{ color:var(--ink); font-weight:700; }
.card__tags{ display:flex; gap:6px; flex-wrap:nowrap; }
.card__tags .badge{ font-size:10px; padding:5px 8px; letter-spacing:.3px; }

.cta{ width:100%; border:0; background:var(--cta); color:#fff; font-size:15px; font-weight:700; padding:13px 16px; border-radius:var(--r-sm); margin-top:12px; transition:background .18s ease; }
.cta:hover{ background:var(--cta-hover); }

/* ---- back / form ---- */
.back{ padding:16px; display:flex; flex-direction:column; height:100%; }
.back__head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.back__title{ font-size:15px; font-weight:800; color:var(--ink); margin:0; }
.back__car{ font-size:11.5px; color:var(--ink-soft); text-align:right; }
.back__sub{ font-size:12px; color:var(--ink-soft); margin:4px 0 12px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.field{ display:flex; flex-direction:column; gap:4px; margin-bottom:9px; }
.field label{ font-size:11px; color:var(--ink-soft); font-weight:600; }
.field input{ width:100%; border:1px solid var(--card-line); background:#fbfdff; color:var(--ink); border-radius:10px; padding:9px 11px; font-size:16px; outline:none; transition:border-color .15s,box-shadow .15s; }
.field input:focus{ border-color:var(--accent-2); box-shadow:0 0 0 3px rgba(66,183,223,.15); }
.field input.invalid{ border-color:var(--cta); box-shadow:0 0 0 3px rgba(236,91,69,.13); }
.consent{ display:flex; gap:8px; align-items:flex-start; margin:2px 0 12px; }
.consent input{ margin-top:2px; width:16px; height:16px; accent-color:var(--accent-2); flex:0 0 auto; }
.consent label{ font-size:11px; color:var(--ink-soft); line-height:1.4; }
.consent.invalid label{ color:var(--cta); }
.consent a{ color:var(--accent); text-decoration:underline; }
.back__actions{ margin-top:auto; display:flex; gap:9px; }
.btn-submit{ flex:1; border:0; background:var(--cta); color:#fff; font-size:14px; font-weight:700; padding:12px; border-radius:var(--r-sm); transition:background .18s ease; }
.btn-submit:hover{ background:var(--cta-hover); }
.btn-submit:disabled{ opacity:.6; cursor:not-allowed; }
.btn-back{ border:1px solid var(--card-line); background:#fff; color:var(--ink-soft); font-size:13px; font-weight:600; padding:12px 14px; border-radius:var(--r-sm); transition:background .15s; }
.btn-back:hover{ background:#f2f6fa; }
.back__result{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; padding:10px; }
.back__result .ico{ width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; }
.back__result.ok .ico{ background:#2ecc71; }
.back__result.err .ico{ background:var(--cta); }
.back__result h4{ margin:0; font-size:16px; color:var(--ink); }
.back__result p{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.45; }

/* ---- lightbox ---- */
.lb{ position:fixed; inset:0; background:#01142b; z-index:99999; display:none; }
.lb.is-open{ display:block; }
.lb .slider{ position:absolute; inset:0; }
.lb .slider__slide{ display:flex; align-items:center; justify-content:center; }
.lb .slider__slide img{ width:100%; height:100%; object-fit:contain; pointer-events:none; }
.lb .gal-nav{ width:48px; height:48px; font-size:26px; opacity:.95; }
.lb .gal-nav--prev{ left:14px; } .lb .gal-nav--next{ right:14px; }
.lb__close{ position:absolute; top:14px; right:14px; z-index:5; width:44px; height:44px; border:0; border-radius:50%; background:rgba(0,23,51,.85); color:#fff; font-size:24px; line-height:1; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(0,0,0,.4); }
.lb__close:hover{ background:#012a5c; }
.lb .gal-count{ top:20px; left:20px; right:auto; font-size:13px; padding:5px 12px; }

/* ---- skeleton / stati ---- */
.skeleton .flip__face{ background:#f3f6f9; }
.sk-media{ aspect-ratio:16/10; background:linear-gradient(90deg,#eef2f6 25%,#e2e9f0 37%,#eef2f6 63%); background-size:400% 100%; animation:sh 1.3s infinite; }
.sk-line{ height:12px; border-radius:6px; margin:12px 16px; background:linear-gradient(90deg,#eef2f6 25%,#e2e9f0 37%,#eef2f6 63%); background-size:400% 100%; animation:sh 1.3s infinite; }
.sk-line.w60{ width:60%; } .sk-line.w40{ width:40%; }
@keyframes sh{ 0%{background-position:100% 0} 100%{background-position:0 0} }
.state{ grid-column:1/-1; text-align:center; color:#c7d6ea; padding:60px 20px; font-size:15px; }
.state button{ margin-top:14px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.06); color:#eaf0ff; padding:10px 18px; border-radius:12px; font-size:14px; }
.state button:hover{ background:rgba(255,255,255,.12); }

@media (max-width:480px){
  body{ padding:12px 10px; }
  .grid{ gap:14px; }
}
@media (prefers-reduced-motion:reduce){
  .flip__inner,.flip__face,.cta,.btn-submit{ transition:none; }
}
</style>

<body>
  <div class="grid" id="grid" aria-live="polite"></div>

  <!-- lightbox (creata una sola volta) -->
  <div class="lb" id="lb" aria-hidden="true">
    <button class="lb__close" type="button" aria-label="Chiudi">&times;</button>
    <div class="slider"><div class="slider__track"></div></div>
  </div>

<script>
(function(){
  "use strict";
  var CFG = window.WIDGET_CONFIG;
  var grid = document.getElementById("grid");
  var K = encodeURIComponent(CFG.API_KEY);

  // Handshake con la pagina ospite: sappiamo se lo snippet e' presente
  var parentReady=false;
  window.addEventListener("message",function(e){ if(e.data&&e.data.type==="autoteam:parentReady") parentReady=true; });
  function sayHello(){ try{ parent.postMessage({type:"autoteam:hello"},"*"); }catch(e){} }
  sayHello(); setTimeout(sayHello,400); setTimeout(sayHello,1200);

  function num(n){ return (n==null||isNaN(n)) ? "" : Number(n).toLocaleString("it-IT"); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function isEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function isPhone(v){ return /^[0-9]{6,}$/.test(v.replace(/[^0-9]/g,"")); }
  function postHeight(){ try{ parent.postMessage({type:"autoteam:height",height:document.body.scrollHeight},"*"); }catch(e){} }
  window.addEventListener("resize", postHeight);

  /* =====================================================================
     SLIDER riutilizzabile: trascinamento touch/mouse + frecce + dots
     root = elemento .slider ; opts.controls (bool) ; opts.onTap(i)
     ===================================================================== */
  function initSlider(root, opts){
    opts=opts||{};
    var track=root.querySelector(".slider__track");
    var n=track.children.length;
    var i=Math.min(opts.start||0, n-1); if(i<0) i=0;
    var startX=0, startY=0, dx=0, dragging=false, moved=false, locked=null;

    function render(animate){
      track.style.transition = animate ? "transform .3s ease" : "none";
      track.style.transform = "translateX(calc(" + (-i*100) + "% + " + dx + "px))";
    }
    // controlli
    var prev,next,count,dots;
    if(n>1){
      if(opts.arrows){
        prev=el("button","gal-nav gal-nav--prev","&#8249;"); prev.setAttribute("aria-label","Precedente");
        next=el("button","gal-nav gal-nav--next","&#8250;"); next.setAttribute("aria-label","Successiva");
        root.appendChild(prev); root.appendChild(next);
        prev.addEventListener("click",function(e){ e.stopPropagation(); go(i-1); });
        next.addEventListener("click",function(e){ e.stopPropagation(); go(i+1); });
      }
      if(opts.counter){ count=el("div","gal-count","1/"+n); root.appendChild(count); }
      if(opts.dots!==false){
        dots=el("div","gal-dots","");
        for(var d=0; d<n; d++){ var s=document.createElement("span"); s.className="gal-dot"+(d===0?" is-active":""); dots.appendChild(s); }
        root.appendChild(dots);
      }
    }
    function el(tag,cls,html){ var e=document.createElement(tag); e.className=cls; if(tag==="button")e.type="button"; e.innerHTML=html; return e; }
    function ui(){
      if(count) count.textContent=(i+1)+"/"+n;
      if(dots) [].forEach.call(dots.children,function(s,j){ s.classList.toggle("is-active",j===i); });
      if(prev) prev.disabled=(i<=0);
      if(next) next.disabled=(i>=n-1);
    }
    function go(j){ i=Math.max(0,Math.min(n-1,j)); dx=0; render(true); ui(); }

    // drag (Pointer Events: touch + mouse)
    track.addEventListener("pointerdown",function(e){
      if(e.target.closest(".gal-nav")) return;
      dragging=true; moved=false; locked=null; startX=e.clientX; startY=e.clientY; dx=0;
      try{ track.setPointerCapture(e.pointerId); }catch(_){}
    });
    track.addEventListener("pointermove",function(e){
      if(!dragging) return;
      var mx=e.clientX-startX, my=e.clientY-startY;
      if(locked===null && (Math.abs(mx)>6 || Math.abs(my)>6)) locked = Math.abs(mx)>Math.abs(my) ? "x":"y";
      if(locked==="y") return;            // scroll verticale: lascia scorrere la pagina
      moved=true;
      dx=mx;
      if((i===0&&dx>0)||(i===n-1&&dx<0)) dx*=0.35;   // resistenza ai bordi
      render(false);
    });
    function end(e){
      if(!dragging) return; dragging=false;
      var th=root.clientWidth*0.16;
      if(dx<=-th) i=Math.min(n-1,i+1);
      else if(dx>=th) i=Math.max(0,i-1);
      dx=0; render(true); ui();
      if(!moved && opts.onTap) opts.onTap(i);   // tap = apri lightbox
    }
    track.addEventListener("pointerup",end);
    track.addEventListener("pointercancel",function(){ dragging=false; dx=0; render(true); });

    render(false); ui();
    return { go:go, index:function(){return i;} };
  }

  /* ---------- lightbox ---------- */
  var lb=document.getElementById("lb");
  var lbTrack=lb.querySelector(".slider__track");
  var usedFullscreen=false;
  function openLightbox(imgs, start){
    start=start||0;
    lbTrack.innerHTML = imgs.map(function(u){
      return '<div class="slider__slide"><img src="'+esc(u)+'" alt=""></div>';
    }).join("");
    [].forEach.call(lb.querySelectorAll(".gal-nav,.gal-count,.gal-dots"),function(n){ n.remove(); });
    usedFullscreen=false;

    // 1) pagina ospite con snippet -> espande l'iframe (funziona anche su iPhone)
    if(parentReady){
      lb.classList.add("is-open"); lb.setAttribute("aria-hidden","false");
      initSlider(lb.querySelector(".slider"), { arrows:false, counter:true, dots:true, start:start });
      try{ parent.postMessage({type:"autoteam:lightbox",open:true},"*"); }catch(e){}
      return;
    }
    // 2) Fullscreen API nativa (desktop, Android, iPad) -> popup in-page a tutto schermo
    var rq = lb.requestFullscreen||lb.webkitRequestFullscreen||lb.msRequestFullscreen;
    if(rq){
      lb.classList.add("is-open"); lb.setAttribute("aria-hidden","false");
      initSlider(lb.querySelector(".slider"), { arrows:false, counter:true, dots:true, start:start });
      try{ var pr=rq.call(lb); usedFullscreen=true; if(pr&&pr.catch) pr.catch(function(){}); }catch(e){}
      return;
    }
    // 3) ultima spiaggia (iPhone senza snippet): apri la foto in una nuova scheda
    var u=imgs[start]||imgs[0]; lbTrack.innerHTML="";
    if(u){ var w=window.open(u,"_blank","noopener"); if(!w){ try{ top.location.href=u; }catch(e){ location.href=u; } } }
  }
  function closeLightbox(){
    if(!lb.classList.contains("is-open")) return;
    lb.classList.remove("is-open"); lb.setAttribute("aria-hidden","true"); lbTrack.innerHTML="";
    if(parentReady){ try{ parent.postMessage({type:"autoteam:lightbox",open:false},"*"); }catch(e){} }
    if(usedFullscreen){
      var ex=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
      if(ex && (document.fullscreenElement||document.webkitFullscreenElement)){ try{ ex.call(document); }catch(e){} }
      usedFullscreen=false;
    }
  }
  document.addEventListener("fullscreenchange",function(){ if(!document.fullscreenElement && usedFullscreen) closeLightbox(); });
  document.addEventListener("webkitfullscreenchange",function(){ if(!document.webkitFullscreenElement && usedFullscreen) closeLightbox(); });
  lb.querySelector(".lb__close").addEventListener("click",closeLightbox);
  lb.addEventListener("click",function(e){ if(e.target===lb) closeLightbox(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeLightbox(); });

  /* ---------- fetch lista ---------- */
  function fetchCars(){
    var url = CFG.API_BASE + "/cars?serialNumbers=" + encodeURIComponent(CFG.SERIALS.join(","))
            + "&size=" + CFG.SERIALS.length + "&key=" + K;
    return fetch(url,{headers:{Accept:"application/json"}})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(res){
        var list=(res&&res.data)?res.data:[];
        var bySn={}; list.forEach(function(c){ bySn[c.serialNumber]=c; });
        return CFG.SERIALS.map(function(sn){ return bySn[sn]; }).filter(Boolean);
      });
  }

  function badges(car){
    var out="";
    if(car.promo && car.promo.name) out+='<span class="badge badge--offer">Offerta esclusiva</span>';
    if((car.tags||[]).indexOf("in_stock")>-1) out+='<span class="badge badge--stock">Usato garantito</span>';
    return out;
  }
  function warranty(car){
    var w=(car.warranty||"").trim(); if(!w) return "";
    var m=w.match(/(\d+)\s*ann/i);
    return '<div class="warranty" title="'+esc(w)+'">'+(m?(m[1]+" anni<br>garanzia"):"garanzia")+'</div>';
  }
  function metaLine(car){
    var t=car.tech||{}, v=car.venue||{}, parts=[];
    if(car.computedVehicleYear) parts.push(esc(car.computedVehicleYear));
    if(car.mileageKm!=null)     parts.push(num(car.mileageKm)+" km");
    if(t.gearType)              parts.push(esc(t.gearType));
    if(t.fuelType)              parts.push(esc(t.fuelType));
    return parts.map(function(p){return "<span>"+p+"</span>";}).join("");
  }

  function frontFace(car){
    var first=(car.images&&car.images[0])?(car.images[0].imageUrl||car.images[0].thumbnailUrl):"";
    var slide0 = first
      ? '<div class="slider__slide"><img src="'+esc(first)+'" alt="'+esc(car.brand+" "+car.model)+'" loading="lazy"></div>'
      : '<div class="slider__slide"></div>';
    var market=car.marketPrice;
    var priceMarket=(market&&market>car.displayPrice)
      ? '<div class="price__market"><span class="price__label">Prezzo medio di mercato</span><span class="price__old">&euro; '+num(market)+'</span></div>' : "";
    var version=esc(car.label||car.version||"");
    var tags=badges(car);
    var town=(car.venue&&car.venue.venueTown)?esc(car.venue.venueTown):"";
    var PIN='<svg class="pin" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
    return ''+
      '<div class="gallery" data-gallery="'+esc(car.serialNumber)+'">'+
        '<div class="slider"><div class="slider__track">'+slide0+'</div></div>'+
        warranty(car)+
      '</div>'+
      '<div class="card__body">'+
        '<h3 class="card__title">'+esc(car.brand)+' <strong>'+esc(car.model)+'</strong></h3>'+
        (version?'<p class="card__version" title="'+version+'">'+version+'</p>':'')+
        (tags?'<div class="card__tags">'+tags+'</div>':'')+
        '<div class="card__meta">'+metaLine(car)+'</div>'+
        (town?'<div class="card__where">'+PIN+'<span>Disponibile a: <strong>'+town+'</strong></span></div>':'')+
        '<div class="price">'+priceMarket+'<span class="price__now">&euro; '+num(car.displayPrice||car.price)+'</span></div>'+
        '<button class="cta" type="button" data-flip="1">Richiedi info</button>'+
      '</div>';
  }

  function backFace(car){
    return ''+
      '<form class="back" novalidate>'+
        '<div class="back__head"><h4 class="back__title">Richiedi informazioni</h4>'+
          '<span class="back__car">'+esc(car.brand+" "+car.model)+'</span></div>'+
        '<p class="back__sub">Ti ricontattiamo noi, senza impegno.</p>'+
        '<div class="field-row">'+
          '<div class="field"><label>Nome</label><input name="firstname" autocomplete="given-name" required></div>'+
          '<div class="field"><label>Cognome</label><input name="lastname" autocomplete="family-name" required></div>'+
        '</div>'+
        '<div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>Telefono</label><input name="phone" type="tel" autocomplete="tel" required></div>'+
          '<div class="field"><label>Citt&agrave;</label><input name="city" autocomplete="address-level2" required></div>'+
        '</div>'+
        '<div class="consent"><input type="checkbox" name="privacy" id="pv-'+car.serialNumber+'">'+
          '<label for="pv-'+car.serialNumber+'">Ho letto e accetto l\'<a href="'+esc(CFG.PRIVACY_URL)+'" target="_blank" rel="noopener">informativa privacy</a>.</label></div>'+
        '<div class="back__actions"><button class="btn-back" type="button" data-flip="0">Indietro</button>'+
          '<button class="btn-submit" type="submit">Invia richiesta</button></div>'+
      '</form>';
  }

  var galObserver=null, countEl=null, emptyEl=null, filterCtrls=null;

  function render(cars){
    if(!cars.length){ grid.innerHTML='<div class="state">Nessuna delle auto richieste &egrave; al momento disponibile.</div>'; postHeight(); return; }

    buildFilters(cars);

    // lazy-load delle gallery: scarica le foto solo quando la card sta per entrare a schermo
    if(galObserver) galObserver.disconnect();
    galObserver = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ var w=e.target; if(!w._galLoaded){ w._galLoaded=true; loadGallery(w, w._car); } galObserver.unobserve(w); }
      });
    }, { rootMargin:"300px 0px" }) : null;

    grid.innerHTML="";
    emptyEl=document.createElement("div"); emptyEl.className="grid__empty"; emptyEl.textContent="Nessuna auto corrisponde ai filtri selezionati.";
    grid.appendChild(emptyEl);

    cars.forEach(function(car){
      var wrap=document.createElement("div");
      wrap.className="flip"; wrap.dataset.sn=car.serialNumber; wrap._car=car;
      wrap.innerHTML='<div class="flip__inner">'+
        '<div class="flip__face flip__face--front">'+frontFace(car)+'</div>'+
        '<div class="flip__face flip__face--back">'+backFace(car)+'</div></div>';
      grid.appendChild(wrap);
      bindCard(wrap,car);
      if(galObserver) galObserver.observe(wrap); else loadGallery(wrap,car);
    });
    applyFilters();
    postHeight();
  }

  /* ---------- filtri (client-side) ---------- */
  function distinct(arr){ var out=[]; arr.forEach(function(v){ if(v&&out.indexOf(v)<0) out.push(v); }); return out.sort(function(a,b){ return String(a).localeCompare(String(b),"it"); }); }
  function toSet(a){ var s={}; a.forEach(function(v){ s[v]=1; }); return s; }
  function cityGroup(town){ var g=CFG.CITY_GROUPS||{}; return (town&&g[town])?g[town]:town; }

  function closeAllMS(except){ [].forEach.call(document.querySelectorAll(".ms.is-open"),function(m){ if(m!==except) m.classList.remove("is-open"); }); }
  document.addEventListener("click",function(){ closeAllMS(null); });

  function makeMulti(label, values, onChange){
    var wrap=document.createElement("div"); wrap.className="ms";
    var btn=document.createElement("button"); btn.type="button"; btn.className="ms__btn";
    btn.innerHTML='<span>'+label+'</span><span class="ms__count"></span><span class="ms__chev">&#9662;</span>';
    var panel=document.createElement("div"); panel.className="ms__panel";
    var sel={};
    values.forEach(function(v){
      var lab=document.createElement("label"); lab.className="ms__opt";
      var cb=document.createElement("input"); cb.type="checkbox"; cb.value=v;
      cb.addEventListener("change",function(){ if(cb.checked) sel[v]=1; else delete sel[v]; upd(); onChange(); });
      lab.appendChild(cb); lab.appendChild(document.createTextNode(" "+v)); panel.appendChild(lab);
    });
    function upd(){ var n=Object.keys(sel).length; wrap.querySelector(".ms__count").textContent=n?(" ("+n+")"):""; btn.classList.toggle("is-active",!!n); }
    btn.addEventListener("click",function(e){ e.stopPropagation(); var open=wrap.classList.contains("is-open"); closeAllMS(wrap); wrap.classList.toggle("is-open",!open); });
    panel.addEventListener("click",function(e){ e.stopPropagation(); });
    wrap.appendChild(btn); wrap.appendChild(panel);
    wrap.getValues=function(){ return Object.keys(sel); };
    wrap.clear=function(){ sel={}; [].forEach.call(panel.querySelectorAll("input"),function(c){ c.checked=false; }); upd(); };
    return wrap;
  }

  function makeRange(label, opts, onChange){
    opts=opts||{};
    var pre = opts.pre?('<span>'+opts.pre+'</span>'):'';
    var post= opts.post?('<span>'+opts.post+'</span>'):'';
    var wrap=document.createElement("div"); wrap.className="price-filter";
    wrap.innerHTML='<span class="pf__lab">'+label+'</span>'+
      '<span class="pf__box">'+pre+'<input type="number" class="pf__min" inputmode="numeric" min="0" placeholder="min">'+post+'</span>'+
      '<span class="pf__dash">&ndash;</span>'+
      '<span class="pf__box">'+pre+'<input type="number" class="pf__max" inputmode="numeric" min="0" placeholder="max">'+post+'</span>';
    var mn=wrap.querySelector(".pf__min"), mx=wrap.querySelector(".pf__max");
    mn.addEventListener("input",onChange); mx.addEventListener("input",onChange);
    wrap.getRange=function(){ return [ mn.value!==""?parseFloat(mn.value):null, mx.value!==""?parseFloat(mx.value):null ]; };
    wrap.clear=function(){ mn.value=""; mx.value=""; };
    return wrap;
  }

  function buildFilters(cars){
    var old=document.querySelector(".filters"); if(old) old.remove();
    var bar=document.createElement("div"); bar.className="filters";
    var years=distinct(cars.map(function(c){return c.computedVehicleYear;})).sort(function(a,b){ return Number(b)-Number(a); });
    var marca=makeMulti("Marca", distinct(cars.map(function(c){return c.brand;})), applyFilters);
    var alim =makeMulti("Alimentazione", distinct(cars.map(function(c){return (c.tech||{}).fuelType;})), applyFilters);
    var anno =makeMulti("Anno", years, applyFilters);
    var citta=makeMulti("Citt\u00e0", distinct(cars.map(function(c){return cityGroup((c.venue||{}).venueTown);})), applyFilters);
    var price=makeRange("Prezzo", {pre:"\u20ac"}, applyFilters);
    var km   =makeRange("Km", {post:"km"}, applyFilters);
    var reset=document.createElement("button"); reset.type="button"; reset.className="filters__reset"; reset.textContent="Azzera filtri";
    reset.addEventListener("click",function(){ marca.clear(); alim.clear(); anno.clear(); citta.clear(); price.clear(); km.clear(); applyFilters(); });
    countEl=document.createElement("div"); countEl.className="filters__count";
    bar.appendChild(marca); bar.appendChild(alim); bar.appendChild(anno); bar.appendChild(citta); bar.appendChild(price); bar.appendChild(km); bar.appendChild(reset); bar.appendChild(countEl);
    grid.parentNode.insertBefore(bar, grid);
    filterCtrls={ marca:marca, alim:alim, anno:anno, citta:citta, price:price, km:km };
  }

  function applyFilters(){
    if(!filterCtrls) return;
    var b=filterCtrls.marca.getValues(), a=filterCtrls.alim.getValues(), y=filterCtrls.anno.getValues(), s=filterCtrls.citta.getValues();
    var pr=filterCtrls.price.getRange(), kr=filterCtrls.km.getRange();
    var bs=toSet(b), as=toSet(a), ys=toSet(y), ss=toSet(s), pmn=pr[0], pmx=pr[1], kmn=kr[0], kmx=kr[1], n=0;
    [].forEach.call(grid.children,function(w){
      var c=w._car; if(!c) return;
      var ok=true;
      if(b.length && !bs[c.brand]) ok=false;
      if(a.length && !as[(c.tech||{}).fuelType]) ok=false;
      if(y.length && !ys[c.computedVehicleYear]) ok=false;
      if(s.length && !ss[cityGroup((c.venue||{}).venueTown)]) ok=false;
      var price=c.displayPrice||c.price||0;
      if(pmn!=null && price<pmn) ok=false;
      if(pmx!=null && price>pmx) ok=false;
      var kmv=c.mileageKm||0;
      if(kmn!=null && kmv<kmn) ok=false;
      if(kmx!=null && kmv>kmx) ok=false;
      w.classList.toggle("is-hidden",!ok);
      if(ok) n++;
    });
    if(countEl) countEl.textContent = n+(n===1?" auto disponibile":" auto disponibili");
    if(emptyEl) emptyEl.style.display = n?"none":"block";
    postHeight();
  }

  /* ---------- gallery: carica tutte le foto dal dettaglio ---------- */
  function loadGallery(wrap, car){
    fetch(CFG.API_BASE+"/cars/"+encodeURIComponent(car.serialNumber)+"?key="+K,{headers:{Accept:"application/json"}})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(res){
        var c=Array.isArray(res)?res[0]:res;
        var imgs=(c&&c.images&&c.images.length)?c.images:(car.images||[]);
        var urls=imgs.map(function(im){ return im.imageUrl||im.thumbnailUrl; }).filter(Boolean);
        setupGallery(wrap, car, urls);
      })
      .catch(function(){ // fallback: almeno la foto principale
        var first=(car.images&&car.images[0])?(car.images[0].imageUrl):null;
        setupGallery(wrap, car, first?[first]:[]);
      });
  }

  function setupGallery(wrap, car, urls){
    var gal=wrap.querySelector(".gallery"); if(!gal||!urls.length) return;
    var sliderEl=gal.querySelector(".slider");
    var track=gal.querySelector(".slider__track");
    track.innerHTML = urls.map(function(u){
      return '<div class="slider__slide"><img src="'+esc(u)+'" alt="'+esc(car.brand+" "+car.model)+'" loading="lazy"></div>';
    }).join("");
    var inst=initSlider(sliderEl, { arrows:false, counter:false, dots:true });   // niente apertura al tocco
    // icona fullscreen dedicata (in basso a destra, accanto ai pallini)
    var fs=document.createElement("button");
    fs.type="button"; fs.className="gal-fs"; fs.setAttribute("aria-label","Apri le foto a schermo intero");
    fs.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
    gal.appendChild(fs);
    fs.addEventListener("click", function(e){ e.stopPropagation(); openLightbox(urls, inst.index()); });
  }

  /* ---------- interazione card ---------- */
  function bindCard(wrap, car){
    wrap.addEventListener("click", function(e){
      if(e.target.closest(".gallery")) return;
      var t=e.target.closest("[data-flip]"); if(!t) return;
      if(t.getAttribute("data-flip")==="1") wrap.classList.add("is-flipped");
      else wrap.classList.remove("is-flipped");
      setTimeout(postHeight,560);
    });
    wrap.querySelector("form").addEventListener("submit", function(e){ e.preventDefault(); submitLead(this,car); });
  }

  /* ---------- invio lead ---------- */
  function submitLead(form, car){
    var f={ firstname:form.firstname.value.trim(), lastname:form.lastname.value.trim(),
            email:form.email.value.trim(), phone:form.phone.value.trim(),
            city:form.city.value.trim(), privacy:form.privacy.checked };
    var ok=true;
    [["firstname",!!f.firstname],["lastname",!!f.lastname],["email",isEmail(f.email)],["phone",isPhone(f.phone)],["city",!!f.city]]
      .forEach(function(p){ form[p[0]].classList.toggle("invalid",!p[1]); if(!p[1]) ok=false; });
    var consent=form.querySelector(".consent"); consent.classList.toggle("invalid",!f.privacy); if(!f.privacy) ok=false;
    if(!ok) return;
    var btn=form.querySelector(".btn-submit"); btn.disabled=true; btn.textContent="Invio in corso...";
    var body={ category:CFG.LEAD_CATEGORY, data:{
      firstname:f.firstname, lastname:f.lastname, email:f.email, phone:f.phone,
      province:"", city:f.city, note:CFG.LEAD_COMMENT, privacy:true,
      dealerId:car.dealerId||"", serialNumber:car.serialNumber,
      url:CFG.DETAIL_PATH+(car.slug||""), gclid:"", fbclid:"",
      privacy_promo:false, privacy_survey:false, privacy_communication:false } };
    fetch(CFG.API_BASE+"/contact/request?key="+K,{ method:"POST",
      headers:{"Content-Type":"application/json",Accept:"application/json"}, body:JSON.stringify(body) })
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
      .then(function(){ showResult(form,true); })
      .catch(function(){ btn.disabled=false; btn.textContent="Invia richiesta"; showResult(form,false); });
  }
  function showResult(form, ok){
    form.innerHTML = ok
      ? '<div class="back__result ok"><div class="ico">&#10003;</div><h4>Richiesta inviata</h4><p>Grazie! Un nostro consulente ti contatter&agrave; a breve.</p></div>'
      : '<div class="back__result err"><div class="ico">!</div><h4>Invio non riuscito</h4><p>Riprova tra poco oppure chiamaci. La richiesta non &egrave; stata registrata.</p><button class="btn-back" type="button" data-flip="0" style="margin-top:6px">Chiudi</button></div>';
    setTimeout(postHeight,50);
  }

  function showError(){
    grid.innerHTML='<div class="state">Impossibile caricare le auto in questo momento.<br><button id="retry">Riprova</button></div>';
    document.getElementById("retry").addEventListener("click", boot); postHeight();
  }
  function skeletons(n){
    grid.innerHTML="";
    for(var i=0;i<n;i++){ var d=document.createElement("div"); d.className="flip skeleton";
      d.innerHTML='<div class="flip__inner"><div class="flip__face flip__face--front"><div class="sk-media"></div><div class="sk-line w60"></div><div class="sk-line w40"></div><div class="sk-line"></div><div class="sk-line w40"></div></div></div>';
      grid.appendChild(d); }
  }
  function boot(){ skeletons(Math.min(6,CFG.SERIALS.length)); postHeight(); fetchCars().then(render).catch(showError); }
  boot();
})();
</script>
</body>
